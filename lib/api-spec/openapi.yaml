openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: storage
    description: Object storage operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned URL for file upload
      description: |
        Returns a GCS presigned PUT URL. The client uploads the file binary
        directly to that URL (not to this server). Store the returned
        objectPath in your database for later retrieval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL and normalized object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"
        "400":
          description: Missing or invalid request body
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    RequestUploadUrlBody:
      type: object
      properties:
        name:
          type: string
          description: Original file name
        size:
          type: number
          description: File size in bytes
        contentType:
          type: string
          description: MIME type of the file
      required:
        - name
        - size
        - contentType

    RequestUploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
          description: GCS presigned PUT URL (upload the file binary directly here)
        objectPath:
          type: string
          description: Normalized object path to store in DB (e.g. /objects/uploads/uuid)
        metadata:
          $ref: "#/components/schemas/RequestUploadUrlBody"
      required:
        - uploadURL
        - objectPath
        - metadata
